# Copy to .github/workflows/codeguild-review.yml in YOUR project to get an AI review comment on
# every pull request. Uses cheap cloud models; set the secrets in your repo settings.
name: codeguild review
on: [pull_request]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install codeguild
      - name: review the PR diff
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}     # free tier is enough
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }} # optional, better critic
        run: |
          codeguild init . -y --profile free
          codeguild review --ref origin/${{ github.base_ref }} > review.txt || true
          cat review.txt
      - name: post as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '### codeguild review\n```\n' + fs.readFileSync('review.txt', 'utf8').slice(0, 60000) + '\n```';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
