[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guild-ai"
version = "0.1.0"
description = "A budget-aware multi-agent coding team: lead, engineer, critic, verifier, security, docs — configured per profile (free / lite / pro)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Arush Kumar Vishwakarma" }]
keywords = ["llm", "agents", "coding-assistant", "multi-agent", "ollama", "openai", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "pyyaml>=6",
  "httpx>=0.27",
  "openai>=1.40",
  "anthropic>=0.34",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
guild = "guild.cli:app"

[project.urls]
Homepage = "https://github.com/arushkv/guild"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guild = ["data/roles/*.yaml", "data/profiles/*.yaml", "data/*.md", "ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/guild/cli.py" = ["E702"]
