[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guild-ai"
version = "0.2.0"
description = "A budget-aware multi-agent coding team: lead, engineer, critic, verifier, security, docs — configured per profile (free / lite / pro)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Arush Kumar Vishwakarma" }]
keywords = ["llm", "agents", "coding-assistant", "multi-agent", "ollama", "openai", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "pyyaml>=6",
  "httpx>=0.27",
  "openai>=1.40",
  "anthropic>=0.34",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
guild = "guild.cli:app"

[project.urls]
Homepage = "https://github.com/Arush70/guild"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guild = ["data/roles/*.yaml", "data/profiles/*.yaml", "data/templates/*.md", "data/*.md", "ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so results do not depend on the ruff version's default rule set.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "B008",   # typer.Option()/Argument() in defaults is the typer idiom
  "RUF012", # mutable class attributes in pydantic models are fine
  "RUF001", "RUF002", "RUF003",  # en dashes / arrows in user-facing text are intentional
]

[tool.ruff.lint.isort]
known-first-party = ["guild", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/guild/cli.py" = ["E702"]
"tests/*" = ["E501"]  # long literal fixtures (scripted model replies) are clearer on one line
