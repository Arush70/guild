name: real-models
# The team on a real local model (Ollama on the runner's CPU), every night and on demand.
# It measures, it does not gate: a failed run is a finding to read in the report, not a red
# build. Each report is also published to the public branch `bench-results` (LATEST.md, and
# runs/<date>-<run>/ with report.json and the traces), readable without signing in.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model for every role
        default: qwen2.5-coder:3b
      runs:
        description: how many fresh runs of the calculator demo
        default: "1"
      fixed_plan:
        description: skip the lead's planning (true/false)
        default: "false"

permissions:
  contents: write  # only to publish the report to the bench-results branch

jobs:
  bench:
    if: github.repository == 'Arush70/guild' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MODEL: ${{ inputs.model || 'qwen2.5-coder:3b' }}
      RUNS: ${{ inputs.runs || '1' }}
      FIXED: ${{ inputs.fixed_plan || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e . pytest  # the demo project is tested with pytest
      - name: Start Ollama and pull the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          ollama pull "$MODEL"
      - name: Profile with that model in every role, $0 cap
        run: |
          mkdir -p ci/.codeguild/profiles
          printf 'profile: ci\n' > ci/.codeguild/config.yaml
          {
            echo "name: ci"
            echo "description: nightly bench on ${MODEL}"
            echo "slots:"
            for slot in frontier coder reasoner cheap; do echo "  ${slot}: [ollama/${MODEL}]"; done
            echo "limits: {max_revision_rounds: 3, max_tool_calls_per_task: 60, max_usd_per_run: 0}"
          } > ci/.codeguild/profiles/ci.yaml
          git config --global user.name "codeguild bench"
          git config --global user.email "bench@localhost"
      - name: codeguild bench
        continue-on-error: true
        run: |
          extra=""
          if [ "$FIXED" = "true" ]; then extra="--fixed-plan"; fi
          codeguild bench -C ci -p ci -n "$RUNS" --dir bench --timeout 150 $extra
      - name: Report
        if: always()
        run: |
          if [ -f bench/report.md ]; then cat bench/report.md >> "$GITHUB_STEP_SUMMARY"; \
          else echo "no report: see the bench step's log" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish the report on the bench-results branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_number }}
        run: |
          [ -f bench/report.md ] || { echo "no report to publish"; exit 0; }
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --depth 1 --branch bench-results "$url" results 2>/dev/null; then
            mkdir results && git -C results init -q -b bench-results && git -C results remote add origin "$url"
          fi
          dest="runs/$(date -u +%Y-%m-%d)-run${RUN}"
          mkdir -p "results/$dest"
          cp bench/report.md bench/report.json "results/$dest/"
          tar czf "results/$dest/traces.tar.gz" bench/run-*/.codeguild/runs 2>/dev/null || true
          { echo "Model: \`${MODEL}\` · run ${RUN} · $(date -u '+%Y-%m-%d %H:%M UTC')"; echo; cat bench/report.md; } > results/LATEST.md
          echo "- $(date -u +%Y-%m-%d) run ${RUN}, ${MODEL}: $(head -1 bench/report.md | sed 's/^# //') ([report]($dest/report.md))" >> results/INDEX.md
          cd results
          git add -A
          git -c user.name="Arush70" -c user.email="ytfinex70@gmail.com" commit -q -m "bench: run ${RUN}, ${MODEL}"
          git push -q origin bench-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.run_number }}
          path: |
            bench/report.md
            bench/report.json
            bench/run-*/.codeguild/runs/**
            ollama.log
          if-no-files-found: warn
