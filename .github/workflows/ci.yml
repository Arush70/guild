name: ci
on:
  push:
    branches: [main]  # not tags: a tag points at old code, already tested when it was pushed
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: VS Code extension tests (uses the installed codeguild)
        run: npm test
        working-directory: vscode-extension
